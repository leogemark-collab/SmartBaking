[project]
name = "smartbaking-forecasting"
version = "0.1.0"
description = "Local forecasting-service foundation for the SmartBaking capstone"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "numpy>=2.1,<3",
    "pandas>=2.2,<4",
    "scipy>=1.14,<2",
    "statsmodels>=0.14.4,<0.16",
    "scikit-learn>=1.6,<2",
    "lightgbm>=4.6,<5",
    "holidays>=0.68,<1",
    "joblib>=1.4,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
]

[project.scripts]
smartbaking-forecasting-serve = "smartbaking_forecasting.cli:serve"
smartbaking-forecasting-smoke = "smartbaking_forecasting.smoke:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartbaking_forecasting"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
